# Maqar's site. Installed as /etc/nginx/sites-enabled/zz-maqar: the "zz" keeps it after the other
# project's site, because with no default_server set, nginx sends unknown hosts to the first site
# it loads. HTTP/2 stays off: turning it on is per port, so it would change the other sites too.
server {
    listen 80;
    listen [::]:80;
    server_name 187-55-224-15.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/maqar-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 187-55-224-15.sslip.io;

    ssl_certificate /etc/letsencrypt/live/187-55-224-15.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187-55-224-15.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;

    location /v1/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        # Appends the real address; the API trusts only this last entry (TRUST_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /srv/maqar/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        return 404;
    }
}
