# Maqar's site. Installed as /etc/nginx/sites-enabled/zz-maqar: the "zz" keeps it after the other
# project's site, because with no default_server set, nginx sends unknown hosts to the first site
# it loads. HTTP/2 stays off: turning it on is per port, so it would change the other sites too.
# Rate limit per client address (contract §15): nginx takes the first burst, then the API's own
# limits answer with 429. The zone is shared by every /v1 location below.
limit_req_zone $binary_remote_addr zone=maqar_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name 187-55-224-15.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/maqar-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 187-55-224-15.sslip.io;

    ssl_certificate /etc/letsencrypt/live/187-55-224-15.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/187-55-224-15.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;

    # The chat socket (Phase 16): a WebSocket upgrade, kept open while the app is.
    location /v1/socket.io/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Chat photos: up to four, resized on the phone first. The API refuses more than 8 MB each.
    location ~ ^/v1/chats/\d+/images$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listing photos from the admin form (Phase 17): one at a time; the API refuses more than 10 MB.
    location = /v1/uploads {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=maqar_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        # Appends the real address; the API trusts only this last entry (TRUST_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /srv/maqar/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The admin dashboard (apps/web, Phase 17): static files that deploy.sh copies to
    # /srv/maqar/web/admin. Pages are never cached, so a deploy shows at once; built assets are.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        root /srv/maqar/web;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }
    location /admin/_next/static/ {
        root /srv/maqar/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public pages the stores require (Phase 20): privacy policy, terms, support and account
    # deletion, Arabic and English. deploy.sh copies deploy/site to /srv/maqar/web/site.
    location ~ ^/(privacy|terms|support|delete-account)$ {
        root /srv/maqar/web/site;
        try_files /$1.html =404;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /site.css {
        root /srv/maqar/web/site;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
