# MQR's site, for mqr.systems and www.mqr.systems. Installed as /etc/nginx/sites-enabled/zz-mqr.
# Rate limit per client address (contract §15): nginx takes the first burst, then the API's own
# limits answer with 429. The zone is shared by every /v1 location below.
limit_req_zone $binary_remote_addr zone=mqr_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mqr.systems www.mqr.systems;

    location /.well-known/acme-challenge/ {
        root /var/www/mqr-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mqr.systems www.mqr.systems;

    ssl_certificate /etc/letsencrypt/live/mqr.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqr.systems/privkey.pem;
    # TLS settings written out here (not certbot's options-ssl-nginx.conf, which only its nginx plugin creates).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mqr_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # The chat socket (Phase 16): a WebSocket upgrade, kept open while the app is.
    location /v1/socket.io/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Chat photos: up to four, resized on the phone first. The API refuses more than 8 MB each.
    location ~ ^/v1/chats/\d+/images$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Listing photos from the admin form (Phase 17): one at a time; the API refuses more than 10 MB.
    location = /v1/uploads {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 360° panoramas from the admin form (Phase 21): one at a time; the API refuses more than 30 MB.
    location = /v1/uploads/panoramas {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Listing videos from the admin form (Phase 26): one at a time, up to 150 MB; the API converts
    # each to H.264, which can take a few minutes on this server, so nginx waits up to 10.
    location = /v1/uploads/videos {
        client_max_body_size 160m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /v1/ {
        limit_req zone=mqr_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        # Appends the real address; the API trusts only this last entry (TRUST_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /srv/mqr/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The admin dashboard (apps/web, Phase 17): static files that deploy.sh copies to
    # /srv/mqr/web/admin. Pages are never cached, so a deploy shows at once; built assets are.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        root /srv/mqr/web;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }
    location /admin/_next/static/ {
        root /srv/mqr/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public pages the stores require (Phase 20): privacy policy, terms, support and account
    # deletion, Arabic and English. deploy.sh copies deploy/site to /srv/mqr/web/site.
    location ~ ^/(privacy|terms|support|delete-account)$ {
        root /srv/mqr/web/site;
        try_files /$1.html =404;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /site.css {
        root /srv/mqr/web/site;
        add_header Cache-Control "no-cache";
    }

    # The bare domain is the website on the store pages: send it to the support page (contacts and
    # links to the other pages) instead of a 404.
    location = / {
        return 302 /support;
    }

    location / {
        return 404;
    }
}
