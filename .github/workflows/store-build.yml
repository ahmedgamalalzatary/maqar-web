# Builds the store-approval app (APP_VARIANT=store: three screens, no server needed).
#
# Output, attached to the run:
#   - maqar-store-<n>.aab : upload this to Google Play (signed with the upload key)
#   - maqar-store-<n>.apk : install on a phone to check it
#
# Needs these repo secrets for the Play bundle: ANDROID_UPLOAD_KEYSTORE_BASE64,
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD.
# The Android build number is the run number, so every build can be uploaded.
name: Store build

on:
  workflow_dispatch:
  push:
    branches: [store-release]

concurrency:
  group: store-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: store
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=6144
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @maqar/shared build

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Write the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "MAQAR_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
            echo "MAQAR_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}"
            echo "MAQAR_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}"
            echo "MAQAR_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}"
          } >> apps/mobile/android/gradle.properties

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build the Play bundle (AAB)
        working-directory: apps/mobile/android
        run: |
          if [ "$HAS_UPLOAD_KEY" != "true" ]; then
            echo "::error::No upload key in the repo secrets, so no Play bundle. See the comment at the top of this workflow."
            exit 1
          fi
          ./gradlew bundleRelease --no-daemon

      - name: Collect the files
        if: always()
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/maqar-store-${ANDROID_VERSION_CODE}.apk" 2>/dev/null || true
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/maqar-store-${ANDROID_VERSION_CODE}.aab" 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maqar-store-android
          path: out/*
          if-no-files-found: warn
          retention-days: 30
