# Bakes the iPhone app of apps/mobile, unsigned, and attaches it to the run:
# - an .xcarchive, for whoever publishes the app to sign under their Apple Developer account
# - an .ipa, for testing (sign it first, for example with a free Apple ID through Sideloadly)
# - the same commit built for the simulator, because a simulator cannot open an .ipa.
#   "iOS launch check" opens that copy.
# The build logs show one line per file compiled, plus errors.
name: iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check the release settings
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Set the EXPO_PUBLIC_API_URL repository variable: the app cannot work without it"; exit 1; }

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @maqar/shared build

      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install the iOS libraries
        working-directory: apps/mobile/ios
        run: pod install

      - name: Archive the app, unsigned
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive -workspace Maqar.xcworkspace -scheme Maqar -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Maqar.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | grep --line-buffered -E '^(CompileC|SwiftCompile|Ld) |^[*][*] |error:'
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package the archive and the .ipa
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP"/Maqar.xcarchive/Products/Applications/*.app out/Payload/
          (cd out && zip -qry "maqar-${GITHUB_SHA::7}-unsigned.ipa" Payload && rm -rf Payload)
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Maqar.xcarchive" "out/maqar-${GITHUB_SHA::7}-unsigned.xcarchive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: maqar-ios
          path: out/*
          retention-days: 14

  simulator-app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check the release settings
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Set the EXPO_PUBLIC_API_URL repository variable: the app cannot work without it"; exit 1; }

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @maqar/shared build

      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install the iOS libraries
        working-directory: apps/mobile/ios
        run: pod install

      # This runner's chip only: Release otherwise compiles everything once per simulator chip.
      - name: Build a Release app for the simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Maqar.xcworkspace -scheme Maqar -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | grep --line-buffered -E '^(CompileC|SwiftCompile|Ld) |^[*][*] |error:'
          test "${PIPESTATUS[0]}" -eq 0

      # Zipped first: an artifact would otherwise lose the app's file permissions.
      - name: Package the simulator app
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent apps/mobile/ios/build/Build/Products/Release-iphonesimulator/Maqar.app out/Maqar-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: maqar-ios-simulator
          path: out/Maqar-simulator.zip
          retention-days: 14
