# Builds the signed Android App Bundle (.aab) for Google Play and attaches it to the run.
# Signed with the upload key in the repo's secrets. Started by hand, for a release.
name: Android AAB

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check the release settings
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Set the EXPO_PUBLIC_API_URL repository variable: the app cannot work without it"; exit 1; }
          test -n "$GOOGLE_MAPS_API_KEY" || echo "::warning::No GOOGLE_MAPS_API_KEY secret: this build has no map on the property page"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the build number below

      # OPS-03: the store build number is the commit count on main, so each upload is higher than the last.
      - name: Set the build number
        run: |
          echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Build number: $(git rev-list --count HEAD)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @maqar/shared build

      # OPS-01: the Firebase app file, so Android gets push tokens. Without the secret the build has no push.
      - name: Put the Firebase file in place
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON_CONTENT }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_CONTENT secret: this build gets no Android push"
          fi

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Put the upload key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build the signed bundle
        working-directory: apps/mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Name the bundle and show who signed it
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/maqar-${GITHUB_SHA::7}.aab"
          keytool -printcert -jarfile out/*.aab | grep -E "Owner|SHA1|SHA256"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: maqar-android-aab
          path: out/*.aab
          retention-days: 14
