# Builds an installable Android APK of apps/mobile and attaches it to the run.
#
# The app talks to the API at EXPO_PUBLIC_API_URL, baked in at build time. Set the
# repo variable EXPO_PUBLIC_API_URL (Settings > Secrets and variables > Actions > Variables),
# or pass api_url when starting the workflow by hand.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL baked into the app (e.g. http://192.168.1.14:4000/v1)
        required: false
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:4000/v1' }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @maqar/shared build

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        # Expo's template signs release builds with the debug key: fine for testing, not for the Play Store.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/maqar-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: maqar-android-apk
          path: out/*.apk
          retention-days: 14
